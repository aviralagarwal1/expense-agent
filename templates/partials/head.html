<script>
/* Runs before any page script. Browser keys were renamed from expense_* to
   compline_*; carry old ones over once so nobody is signed out or loses their
   saved card. The shim can go once old keys are gone (see notes). Then mark a
   signed-in visitor before paint so public pages show the right nav. */
try {
  var s = sessionStorage, l = localStorage, move = function (store, from, to) {
    var v = store.getItem(from);
    if (v !== null) { if (store.getItem(to) === null) store.setItem(to, v); store.removeItem(from); }
  };
  move(s, "expense_token", "compline_token");
  move(s, "expense_refresh_token", "compline_refresh_token");
  Object.keys(l).forEach(function (k) { if (k.indexOf("expense_") === 0) move(l, k, "compline_" + k.slice(8)); });
  if (s.getItem("compline_token")) document.documentElement.classList.add("is-signed-in");
} catch (e) {}
</script>
